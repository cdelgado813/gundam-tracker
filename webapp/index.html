<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Gestiona tu colección del Gundam Card Game: colección, wishlist y listas de intercambio. Sin cuentas, todo en tu dispositivo." />
    <!-- CSP estricta (task 6.3): solo la propia app + API e imágenes de CardTrader.
         'unsafe-inline' en style-src es necesario para los atributos style de React
         y el CSS-in-JS de Radix; no hay script inline. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cardtrader.com https://www.cardtrader.com; connect-src 'self' https://api.cardtrader.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    />
    <title>Gundam Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
