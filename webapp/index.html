    <!-- CSP estricta (task 6.3): la app solo se conecta consigo misma (catálogo/precios
         son JSON estático propio, generados en CI); las imágenes de cartas siguen
         sirviéndose desde el CDN de CardTrader. 'unsafe-inline' en style-src es
         necesario para los atributos style de React y el CSS-in-JS de Radix. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cardtrader.com https://www.cardtrader.com; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    />
    <title>Gundam Tracker</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
