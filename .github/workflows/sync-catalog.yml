name: Sync Gundam catalog

on:
  schedule:
    - cron: '17 3 * * *' # diario, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync catalog from CardTrader
        env:
          CARDTRADER_JWT: ${{ secrets.CARDTRADER_JWT }}
        run: node scripts/sync-catalog.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data
          # sin [skip ci]: este push debe disparar el workflow de deploy
          git diff --staged --quiet || git commit -m "Sync Gundam catalog data"
          git push
